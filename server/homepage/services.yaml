# One tile per app. `container` is the name from docker-compose.yml: Homepage uses it to show
# a running/stopped badge plus CPU and memory. `href` is what opens when you click the tile.
# {{HOMEPAGE_VAR_SERVER_IP}} is filled in from SERVER_IP in your .env.

- Watch:
    - Jellyfin:
        icon: jellyfin.png
        href: http://{{HOMEPAGE_VAR_SERVER_IP}}:8096
        description: Watch your library
        server: docker
        container: jellyfin
    - Seerr:
        icon: seerr.png
        href: http://{{HOMEPAGE_VAR_SERVER_IP}}:5055
        description: Request movies and shows
        server: docker
        container: seerr
    - JellyDash:
        icon: mdi-chart-box
        href: http://{{HOMEPAGE_VAR_SERVER_IP}}:3002
        description: Who watched what
        server: docker
        container: jellydash

- Find:
    - Sonarr:
        icon: sonarr.png
        href: http://{{HOMEPAGE_VAR_SERVER_IP}}:8989
        description: TV shows
        server: docker
        container: sonarr
    - Radarr:
        icon: radarr.png
        href: http://{{HOMEPAGE_VAR_SERVER_IP}}:7878
        description: Movies
        server: docker
        container: radarr
    - Prowlarr:
        icon: prowlarr.png
        href: http://{{HOMEPAGE_VAR_SERVER_IP}}:9696
        description: Indexers (inside the VPN)
        server: docker
        container: prowlarr
    - Bazarr:
        icon: bazarr.png
        href: http://{{HOMEPAGE_VAR_SERVER_IP}}:6767
        description: Subtitles
        server: docker
        container: bazarr

- Download:
    - qBittorrent:
        icon: qbittorrent.png
        href: http://{{HOMEPAGE_VAR_SERVER_IP}}:8080
        description: Downloads (inside the VPN)
        server: docker
        container: qbittorrent
    - SABnzbd:
        icon: sabnzbd.png
        href: http://{{HOMEPAGE_VAR_SERVER_IP}}:8085
        description: Usenet downloads
        server: docker
        container: sabnzbd
    - Gluetun:
        icon: gluetun.png
        description: The VPN tunnel
        server: docker
        container: gluetun
    - FlareSolverr:
        icon: flaresolverr.png
        description: Gets Prowlarr past Cloudflare
        server: docker
        container: flaresolverr

- Home network:
    - AdGuard Home:
        icon: adguard-home.png
        href: http://{{HOMEPAGE_VAR_SERVER_IP}}:3001
        description: Blocks ads and trackers for every device
        server: docker
        container: adguard
    - Beszel:
        icon: beszel.png
        href: http://{{HOMEPAGE_VAR_SERVER_IP}}:3003
        description: Server health charts, alerts for disk, heat and memory
        server: docker
        container: beszel
    - Uptime Kuma:
        icon: uptime-kuma.png
        href: http://{{HOMEPAGE_VAR_SERVER_IP}}:3004
        description: Checks every app, buzzes your phone if one breaks
        server: docker
        container: uptime-kuma
        widget:
          type: uptimekuma
          url: http://uptime-kuma:3001
          # The status page made in README.md step 22f.
          slug: server
    - Vaultwarden:
        icon: vaultwarden.png
        href: https://vault.jevans.cloud
        description: Your passwords (home only)
        server: docker
        container: vaultwarden
    - MySpeed:
        icon: myspeed.png
        href: http://{{HOMEPAGE_VAR_SERVER_IP}}:5216
        description: Home internet speed, tested every hour
        server: docker
        container: myspeed
        widget:
          type: myspeed
          url: http://myspeed:5216

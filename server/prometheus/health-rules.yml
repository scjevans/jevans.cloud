# Health checks, worked out by Prometheus every 30 seconds from the readings it already keeps.
# Each one boils a question down to a single number, so Uptime Kuma only has to ask
# "is it still 0?" (or "still 1?") and buzz your phone when it isn't. See README.md step 22.
# Like a nurse's chart: the machines take the readings, these lines are the "call the doctor if..." notes.
groups:
  - name: health
    rules:
      # How many of the two drives (the system SSD at / and the media drive at /data) are over 90% full. Fine: 0.
      - record: health:drives_over_90_percent
        expr: |
          count(
            1 - node_filesystem_avail_bytes{mountpoint=~"/|/data"} / node_filesystem_size_bytes{mountpoint=~"/|/data"} > 0.9
          ) or vector(0)

      # Is the media drive plugged in and mounted at /data? Fine: 1.
      # If the USB drive drops off, /data turns into an empty folder on the SSD and the apps start filling that instead.
      - record: health:media_drive_mounted
        expr: |
          count(node_filesystem_size_bytes{mountpoint="/data"} > 1e12) or vector(0)

      # How many temperature sensors (CPU cores, drives) read over 85°C. Fine: 0.
      - record: health:sensors_over_85c
        expr: |
          count(node_hwmon_temp_celsius > 85) or vector(0)

      # Is less than 5% of the memory free? Fine: 0.
      - record: health:memory_almost_full
        expr: |
          count(node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.05) or vector(0)

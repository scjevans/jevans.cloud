# Prometheus's round: every 30 seconds it visits each address below, asks "how are you?",
# and writes the answers down. Grafana draws its charts from those notes.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

# The "call the doctor if..." notes that Uptime Kuma checks (README.md step 23).
rule_files:
  - /etc/prometheus/health-rules.yml

scrape_configs:
  # Prometheus keeping an eye on itself.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The server itself: CPU, memory, drives, temperatures, network.
  # node-exporter sits on the server's own network, so Prometheus reaches it through the host.
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          instance: jevans-server

  # Every container: how much CPU, memory and network each app uses.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

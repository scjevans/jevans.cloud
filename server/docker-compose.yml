# Media server stack: Jellyfin + the arr suite, with downloads locked inside a VPN.
# Fill in .env first (copy .env.example), then run: docker compose up -d
# See README.md in this folder for the full walkthrough.

name: media

networks:
  media:
    ipam:
      config:
        # Fixed range so the VPN firewall can allow traffic between containers,
        # and so Prowlarr (inside the VPN) can find Sonarr/Radarr by address.
        - subnet: 172.30.0.0/24
  # The TV guide fetcher only needs the internet, so it gets its own quiet line.
  guide:
  # The dashboard and its Docker helper talk on their own network, away from the media apps.
  dashboard:
  # Jellystat and its database talk on a private line. The database has no internet and no door to your network.
  jellystat:
    internal: true
  # Grafana, Prometheus and cAdvisor talk here. Only Grafana has a door to your network.
  monitoring:

x-common-env: &common-env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}

services:
  # ---- The VPN tunnel. qBittorrent and Prowlarr live inside it. ----
  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ}
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER}
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES}
      # Let the containers inside the tunnel talk to the rest of the stack and your home network.
      FIREWALL_OUTBOUND_SUBNETS: 172.30.0.0/24,${LAN_SUBNET}
    ports:
      # The web pages of the apps inside the tunnel are published here, on gluetun.
      - 8080:8080 # qBittorrent
      - 9696:9696 # Prowlarr
    volumes:
      - ${CONFIG_DIR}/gluetun:/gluetun
    networks:
      media:
        ipv4_address: 172.30.0.2
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    # Share gluetun's network. No VPN means no internet for this container: that is the kill switch.
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      <<: *common-env
      WEBUI_PORT: 8080
    volumes:
      - ${CONFIG_DIR}/qbittorrent:/config
      - ${DATA_DIR}:/data
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      <<: *common-env
    volumes:
      - ${CONFIG_DIR}/prowlarr:/config
    restart: unless-stopped

  # Opens Cloudflare-protected search sites for Prowlarr in a hidden browser.
  # Inside the tunnel too, so those sites see the VPN, not your home. Prowlarr reaches it at http://localhost:8191.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    restart: unless-stopped

  # ---- Everything below uses your normal connection. ----
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      <<: *common-env
    ports:
      - 8989:8989
    volumes:
      - ${CONFIG_DIR}/sonarr:/config
      - ${DATA_DIR}:/data
    networks:
      media:
        ipv4_address: 172.30.0.11
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      <<: *common-env
    ports:
      - 7878:7878
    volumes:
      - ${CONFIG_DIR}/radarr:/config
      - ${DATA_DIR}:/data
    networks:
      media:
        ipv4_address: 172.30.0.12
    restart: unless-stopped

  # The Usenet downloader. Fetches files from your paid Usenet provider over an encrypted (SSL) line.
  # Outside the VPN on purpose: SSL already hides what you download from your ISP, and you never upload
  # to anyone, so there's no swarm to see your address. Skipping the tunnel keeps it at full speed.
  # Home only, no Caddy site: http://<server-ip>:8085. See README.md step 20.
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      <<: *common-env
    ports:
      # 8080 inside, 8085 outside: qBittorrent already has 8080.
      - 8085:8080
    volumes:
      - ${CONFIG_DIR}/sabnzbd:/config
      - ${DATA_DIR}:/data
    networks:
      media:
        # Sonarr and Radarr reach it by this address (README.md step 20).
        ipv4_address: 172.30.0.19
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      <<: *common-env
    ports:
      - 6767:6767
    volumes:
      - ${CONFIG_DIR}/bazarr:/config
      - ${DATA_DIR}/media:/data/media
    networks:
      media:
        ipv4_address: 172.30.0.13
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      <<: *common-env
      JELLYFIN_PublishedServerUrl: ${JELLYFIN_URL}
    ports:
      - 8096:8096
    volumes:
      - ${CONFIG_DIR}/jellyfin:/config
      # Jellyfin only needs to read your library, never change it.
      - ${DATA_DIR}/media:/data/media:ro
      # The TV guide that the xmltv container writes (README.md step 22). Read-only here too.
      - ${CONFIG_DIR}/xmltv/guide:/xmltv:ro
    # The CPU's built-in graphics chip (Intel Quick Sync), for fast video conversion.
    # Turn it on in Jellyfin: Dashboard → Playback → Transcoding. Remove these two lines on a server without /dev/dri.
    devices:
      - /dev/dri:/dev/dri
    networks:
      media:
        ipv4_address: 172.30.0.10
    restart: unless-stopped

  # The TV guide for Jellyfin's Live TV: what's on each channel, and when.
  # Built from XMLTV (https://github.com/xmltv/xmltv) using the Dockerfile in the xmltv/ folder next to this file.
  # Every 6 hours it reads your iptv-org playlists, tells iptv-epg (below) which channels need listings,
  # picks up the guide iptv-epg built, and leaves guide.xml where Jellyfin can read it.
  # No web page and no port. Outside the VPN: guide data isn't private. See README.md step 22.
  xmltv:
    build: ./xmltv
    container_name: xmltv
    # Runs as you, so its folder in CONFIG_DIR needs no special owner.
    user: ${PUID}:${PGID}
    environment:
      TZ: ${TZ}
      # Grabbers keep their settings in $HOME/.xmltv, so point $HOME at its config folder.
      HOME: /config
      # The M3U playlists you add to Jellyfin, separated by spaces. Set in .env.
      XMLTV_PLAYLISTS: ${XMLTV_PLAYLISTS:-}
      # Optional: ready-made guide links, separated by spaces.
      XMLTV_GUIDE_URLS: ${XMLTV_GUIDE_URLS:-}
      # Optional: also run an XMLTV grabber, e.g. tv_grab_zz_sdjson for Schedules Direct (README.md step 22g).
      XMLTV_GRABBER: ${XMLTV_GRABBER:-}
      XMLTV_DAYS: 14
      XMLTV_EVERY_HOURS: 6
    volumes:
      # The downloaded guides, any grabber settings, the iptv-org/ folder it shares with iptv-epg,
      # and the finished guide in guide/.
      - ${CONFIG_DIR}/xmltv:/config
    networks:
      - guide
    restart: unless-stopped

  # Builds the TV guide for iptv-org's channels. Nobody publishes one ready-made, so this visits each
  # channel's listings website and writes down what's on, once a day. Like a reporter phoning every
  # station for its schedule, so the paperboy (xmltv) has something to deliver.
  # Runs iptv-epg/run.sh instead of the image's own timer, to do the channels in batches: all at
  # once ran out of memory. It reads channels/ (written by xmltv) and writes guides/, both in the
  # shared iptv-org/ folder.
  iptv-epg:
    image: ghcr.io/iptv-org/epg:master
    container_name: iptv-epg
    command: ["sh", "/run.sh"]
    # Passes on "stop" so docker compose down doesn't wait 10 seconds.
    init: true
    environment:
      TZ: ${TZ}
      # 2am, when nobody is watching. Each run works hard for a while.
      GRAB_AT: "02:00"
      # Two days of listings, ten websites at a time. More days means a longer run and more memory.
      DAYS: 2
      MAX_CONNECTIONS: 10
      # Each batch keeps its listings in memory until the end. Node.js stops at about 2 GB unless
      # told otherwise; this is the ceiling, not what it always uses.
      NODE_OPTIONS: --max-old-space-size=3072
    volumes:
      - ${CONFIG_DIR}/xmltv/iptv-org:/epg/public
      - ./iptv-epg/run.sh:/run.sh:ro
    networks:
      - guide
    restart: unless-stopped

  # Lets Jellyfin apps at home find the server on their own. Apps shout "any Jellyfin here?" to the
  # whole network on UDP port 7359; that shout can't get inside Docker's private network, so this
  # sits on the server's real network, hears it, and passes it to Jellyfin, then carries the answer back.
  jellyfin-discovery:
    image: alpine/socat:latest
    container_name: jellyfin-discovery
    command: UDP4-RECVFROM:7359,broadcast,fork UDP4-SENDTO:172.30.0.10:7359
    network_mode: host
    depends_on:
      - jellyfin
    restart: unless-stopped

  # Lets people ask for a movie or show. Approved requests go straight to Sonarr/Radarr.
  # At home: http://<server-ip>:5055. Away: https://requests.jevans.cloud, through Caddy (README.md step 8).
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    # Seerr runs as user 1000 inside the container; its config folder must belong to 1000. See README.md step 5.
    init: true
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    ports:
      - 5055:5055
    volumes:
      - ${CONFIG_DIR}/seerr:/app/config
    networks:
      media:
        ipv4_address: 172.30.0.14
    restart: unless-stopped

  # Watch statistics for Jellyfin: who watched what, when, and for how long. Home only, no Caddy site.
  # Open it at http://<server-ip>:3002. See README.md step 11.
  jellystat:
    image: cyfershepard/jellystat:latest
    container_name: jellystat
    depends_on:
      jellystat-db:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      POSTGRES_IP: jellystat-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: jellystat
      POSTGRES_PASSWORD: ${JELLYSTAT_DB_PASSWORD}
      JWT_SECRET: ${JELLYSTAT_JWT_SECRET}
    ports:
      # 3000 inside, 3002 outside: the dashboard has 3000 and AdGuard has 3001.
      - 3002:3000
    volumes:
      - ${CONFIG_DIR}/jellystat/backup-data:/app/backend/backup-data
    networks:
      jellystat:
      # So it can reach Jellyfin at http://jellyfin:8096.
      media:
        ipv4_address: 172.30.0.16
    restart: unless-stopped

  # Jellystat's notebook: a small Postgres database. Only Jellystat can reach it.
  jellystat-db:
    image: postgres:15
    container_name: jellystat-db
    environment:
      POSTGRES_USER: jellystat
      # Only used the very first time, when the database is created. Changing it later in .env does nothing.
      POSTGRES_PASSWORD: ${JELLYSTAT_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jellystat"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ${CONFIG_DIR}/jellystat/db:/var/lib/postgresql/data
    networks:
      - jellystat
    restart: unless-stopped

  # ---- The front door: lets people outside your home reach Jellyfin and Seerr, and nothing else. ----
  # Serves https://media.jevans.cloud and https://requests.jevans.cloud with free, self-renewing certificates. See README.md steps 7 and 8.
  caddy:
    image: caddy:2
    container_name: caddy
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Keep it, or Caddy has to ask for new ones on every rebuild.
      - ${CONFIG_DIR}/caddy/data:/data
      - ${CONFIG_DIR}/caddy/config:/config
    networks:
      media:
        # Fixed so Jellyfin can be told this address is its trusted proxy.
        ipv4_address: 172.30.0.20
    restart: unless-stopped

  # ---- The ad blocker: answers "where is this website?" for every device at home. ----
  # Ads and trackers get "nowhere", everything else gets the real answer. See README.md step 10.
  # Setup page (first time only): http://<server-ip>:3001. Then the router hands out the server as DNS.
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    environment:
      # Without this it runs on UTC, so the query log and stats show the wrong hours.
      TZ: ${TZ}
    ports:
      # DNS, bound to the server's home address only. Ubuntu's own resolver keeps 127.0.0.53:53, so they don't clash.
      - ${SERVER_IP}:53:53/tcp
      - ${SERVER_IP}:53:53/udp
      # Its web page. 3000 inside, 3001 outside, because the dashboard already has 3000.
      - 3001:3000/tcp
    volumes:
      - ${CONFIG_DIR}/adguard/work:/opt/adguardhome/work
      - ${CONFIG_DIR}/adguard/conf:/opt/adguardhome/conf
    networks:
      media:
        ipv4_address: 172.30.0.15
    restart: unless-stopped

  # ---- The speed check: MySpeed tests your home internet on a timer and keeps the results. ----
  # Like a bathroom scale that weighs you every hour and writes it down, so you can see the trend.
  # Outside the VPN on purpose: it should measure your real Fios line, not the tunnel.
  # Home only, no Caddy site: http://<server-ip>:5216. See README.md step 18.
  myspeed:
    image: germannewsmaker/myspeed:latest
    container_name: myspeed
    environment:
      TZ: ${TZ}
    ports:
      - 5216:5216
    volumes:
      # Every test result lives here.
      - ${CONFIG_DIR}/myspeed:/myspeed/data
    networks:
      media:
        # So the dashboard can show the latest result on its tile.
        ipv4_address: 172.30.0.18
    restart: unless-stopped

  # ---- The password safe: Vaultwarden, a home-made Bitwarden server. ----
  # The official Bitwarden apps and browser extensions talk to it as if it were Bitwarden's own cloud.
  # No port on your network: the apps insist on HTTPS, so the only way in is
  # https://vault.jevans.cloud through Caddy, and Caddy only lets in devices at home. See README.md step 17.
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    # Locked down: runs as you instead of the all-powerful root user, can't gain extra powers,
    # and can't change any of its own files. The only place it can write is its vault folder.
    user: ${PUID}:${PGID}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TZ: ${TZ}
      DOMAIN: https://vault.jevans.cloud
      # Listen on 8080 inside the box: ports below 1024 need root, and it no longer runs as root.
      ROCKET_PORT: 8080
      # Off once your account exists. README.md step 17 turns it on for one minute to make it.
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED}
      # The settings page at https://vault.jevans.cloud/admin. Its password is stored scrambled (a hash), never in plain text.
      # Leave it blank and the page is switched off entirely (README.md step 17e).
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      # Hide "Forgot password? Get a hint", which would otherwise show your hint to anyone who types your email.
      SHOW_PASSWORD_HINT: "false"
      # Don't fetch each saved website's little logo. Fetching them would tell your ISP
      # (and every one of those sites) which accounts you keep. Items show a plain globe instead.
      DISABLE_ICON_DOWNLOAD: "true"
    volumes:
      # Your whole vault lives here (scrambled with your master password). Back this folder up.
      - ${CONFIG_DIR}/vaultwarden:/data
    networks:
      media:
        # So Caddy can reach it.
        ipv4_address: 172.30.0.17
    restart: unless-stopped

  # ---- The dashboard: one page showing every container, with links. ----
  # Open it at https://home.jevans.cloud (home only, through Caddy) or http://<server-ip>:3000.
  # Its layout lives in the homepage/ folder next to this file.
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    depends_on:
      - dockerproxy
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      HOMEPAGE_ALLOWED_HOSTS: ${SERVER_IP}:3000,home.jevans.cloud
      HOMEPAGE_VAR_SERVER_IP: ${SERVER_IP}
      HOMEPAGE_VAR_TZ: ${TZ}
    ports:
      - 3000:3000
    volumes:
      - ./homepage:/app/config
      # Only so the dashboard can show how full the drive is.
      - ${DATA_DIR}:/data:ro
    networks:
      dashboard:
      # So Caddy can reach it for home.jevans.cloud.
      media:
        ipv4_address: 172.30.0.30
    restart: unless-stopped

  # A doorman for Docker. Homepage may ask "what's running?", nothing else:
  # starting, stopping or creating containers is refused. Not reachable from your network.
  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: dockerproxy
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dashboard
    restart: unless-stopped

  # ---- Server health: charts of CPU, memory, drives, temperatures and each app's use. ----
  # Like a car's dashboard: cAdvisor and node-exporter are the sensors, Prometheus is the logbook
  # that writes their readings down every 30 seconds, Grafana draws the gauges. See README.md step 16.
  # Home only, no Caddy site: http://<server-ip>:3003.
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    # Runs as you, so its folder in CONFIG_DIR needs no special owner.
    user: ${PUID}:${PGID}
    depends_on:
      - prometheus
    environment:
      TZ: ${TZ}
      GF_SECURITY_ADMIN_USER: admin
      # Only used the very first time. After that, change the password inside Grafana.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # Open straight onto the server dashboard.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/server.json
    ports:
      # 3000 inside, 3003 outside: the dashboard, AdGuard and Jellystat have 3000 to 3002.
      - 3003:3000
    volumes:
      - ${CONFIG_DIR}/grafana:/var/lib/grafana
      # The Prometheus connection and the ready-made dashboard, from the grafana/ folder next to this file.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - monitoring
    restart: unless-stopped

  # ---- The alarm: Uptime Kuma checks every app and the server's health once a minute ----
  # and sends a push notification to your phone (through the ntfy app) when something breaks, and again when it's fixed.
  # Like a night watchman doing rounds with a list: "Jellyfin's door open? VPN on? Drive plugged in?"
  # Home only, no Caddy site: http://<server-ip>:3004. Away from home, Tailscale on your phone gets you in. See README.md step 23.
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    environment:
      TZ: ${TZ}
    ports:
      # 3001 inside, 3004 outside: AdGuard has 3001 and Grafana has 3003.
      - 3004:3001
    volumes:
      # Your monitors, alert settings and history live here.
      - ${CONFIG_DIR}/uptime-kuma:/app/data
    networks:
      # To knock on each app's door by name (jellyfin, sonarr...).
      media:
        ipv4_address: 172.30.0.21
      # To read Prometheus's health checks.
      monitoring:
      # To ask the Docker doorman (dockerproxy) whether each container is running and healthy. Read-only.
      dashboard:
    restart: unless-stopped

  # The logbook. Keeps 30 days of readings, then forgets the oldest. No port on your network.
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    user: ${PUID}:${PGID}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    extra_hosts:
      # So it can reach node-exporter, which lives on the server's own network.
      - host.docker.internal:host-gateway
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/health-rules.yml:/etc/prometheus/health-rules.yml:ro
      - ${CONFIG_DIR}/prometheus:/prometheus
    networks:
      - monitoring
    restart: unless-stopped

  # Sensor for the server itself: CPU, memory, drives, temperatures, network.
  # Uses the server's own network so it sees the real network card, on port 9100 (read-only numbers).
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    command:
      - --path.rootfs=/host
    network_mode: host
    pid: host
    volumes:
      # The whole server, read-only, so it can measure every drive (including /data).
      - /:/host:ro,rslave
    restart: unless-stopped

  # Sensor for the containers: how much each app uses. It has to look at Docker and the kernel
  # directly, so it gets wide read access; it has no port on your network.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring
    restart: unless-stopped

# Media server stack: Jellyfin + the arr suite, with downloads locked inside a VPN.
# Fill in .env first (copy .env.example), then run: docker compose up -d
# See README.md in this folder for the full walkthrough.

name: media

networks:
  media:
    ipam:
      config:
        # Fixed range so the VPN firewall can allow traffic between containers,
        # and so Prowlarr (inside the VPN) can find Sonarr/Radarr by address.
        - subnet: 172.30.0.0/24
  # The dashboard and its Docker helper talk on their own network, away from the media apps.
  dashboard:
  # Beszel's hub sits here on its own. Its only door to your network is port 3003.
  monitoring:

x-common-env: &common-env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}

services:
  # ---- The VPN tunnel. qBittorrent and Prowlarr live inside it. ----
  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ}
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER}
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES}
      # Let the containers inside the tunnel talk to the rest of the stack and your home network.
      FIREWALL_OUTBOUND_SUBNETS: 172.30.0.0/24,${LAN_SUBNET}
    ports:
      # The web pages of the apps inside the tunnel are published here, on gluetun.
      - 8080:8080 # qBittorrent
      - 9696:9696 # Prowlarr
      - 9191:9191 # Dispatcharr
    volumes:
      - ${CONFIG_DIR}/gluetun:/gluetun
    networks:
      media:
        ipv4_address: 172.30.0.2
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    # Share gluetun's network. No VPN means no internet for this container: that is the kill switch.
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      <<: *common-env
      WEBUI_PORT: 8080
    volumes:
      - ${CONFIG_DIR}/qbittorrent:/config
      - ${DATA_DIR}:/data
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      <<: *common-env
    volumes:
      - ${CONFIG_DIR}/prowlarr:/config
    restart: unless-stopped

  # Opens Cloudflare-protected search sites for Prowlarr in a hidden browser.
  # Inside the tunnel too, so those sites see the VPN, not your home. Prowlarr reaches it at http://localhost:8191.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    restart: unless-stopped

  # ---- Live TV: Dispatcharr tidies up TV channel lists (M3U) and TV guides (EPG) and hands them to Jellyfin. ----
  # Like a TV listings magazine editor: it takes a huge messy pile of channels, keeps only the ones you tick,
  # matches each to its guide listings, and gives Jellyfin one neat list. Jellyfin's Live TV then plays them.
  # Everything runs inside this one container (its own small database and queue), so there's nothing else to add.
  # Inside the tunnel, so your TV provider sees the VPN, not your home. No VPN means no Live TV: same kill switch.
  # Its page is published on gluetun: http://<server-ip>:9191 at home, and Jellyfin reaches it at http://gluetun:9191.
  # Kept on a short leash below because this box is small: earlier Live TV attempts were too heavy. See README.md step 26.
  dispatcharr:
    # Pinned to one release. To update: change the number, then `docker compose pull dispatcharr && docker compose up -d dispatcharr`.
    image: ghcr.io/dispatcharr/dispatcharr:0.32.0
    container_name: dispatcharr
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      <<: *common-env
      DISPATCHARR_ENV: aio
      REDIS_HOST: localhost
      CELERY_BROKER_URL: redis://localhost:6379/0
      DISPATCHARR_LOG_LEVEL: info
      # Fewer helpers than the default (4 and 6): plenty for one household, and much less memory.
      UWSGI_WORKERS: 2
      CELERY_MAX_WORKERS: 2
    volumes:
      # Settings, its database, logos and logs live here.
      - ${CONFIG_DIR}/dispatcharr:/data
    # The leash: at most 1.5 GB of memory and 2 of the 4 CPU cores, so Jellyfin and the downloads always have room.
    mem_limit: 1536m
    cpus: 2
    restart: unless-stopped

  # ---- Everything below uses your normal connection. ----
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      <<: *common-env
    ports:
      - 8989:8989
    volumes:
      - ${CONFIG_DIR}/sonarr:/config
      - ${DATA_DIR}:/data
    networks:
      media:
        ipv4_address: 172.30.0.11
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      <<: *common-env
    ports:
      - 7878:7878
    volumes:
      - ${CONFIG_DIR}/radarr:/config
      - ${DATA_DIR}:/data
    networks:
      media:
        ipv4_address: 172.30.0.12
    restart: unless-stopped

  # The Usenet downloader. Fetches files from your paid Usenet provider over an encrypted (SSL) line.
  # Outside the VPN on purpose: SSL already hides what you download from your ISP, and you never upload
  # to anyone, so there's no swarm to see your address. Skipping the tunnel keeps it at full speed.
  # Home only, no Caddy site: http://<server-ip>:8085. See README.md step 20.
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      <<: *common-env
    ports:
      # 8080 inside, 8085 outside: qBittorrent already has 8080.
      - 8085:8080
    volumes:
      - ${CONFIG_DIR}/sabnzbd:/config
      - ${DATA_DIR}:/data
    networks:
      media:
        # Sonarr and Radarr reach it by this address (README.md step 20).
        ipv4_address: 172.30.0.19
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      <<: *common-env
    ports:
      - 6767:6767
    volumes:
      - ${CONFIG_DIR}/bazarr:/config
      - ${DATA_DIR}/media:/data/media
    networks:
      media:
        ipv4_address: 172.30.0.13
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      <<: *common-env
      JELLYFIN_PublishedServerUrl: ${JELLYFIN_URL}
    ports:
      - 8096:8096
    volumes:
      - ${CONFIG_DIR}/jellyfin:/config
      # Jellyfin only needs to read your library, never change it.
      - ${DATA_DIR}/media:/data/media:ro
    # The CPU's built-in graphics chip (Intel Quick Sync), for fast video conversion.
    # Turn it on in Jellyfin: Dashboard → Playback → Transcoding. Remove these two lines on a server without /dev/dri.
    devices:
      - /dev/dri:/dev/dri
    networks:
      media:
        ipv4_address: 172.30.0.10
    restart: unless-stopped

  # Lets Jellyfin apps at home find the server on their own. Apps shout "any Jellyfin here?" to the
  # whole network on UDP port 7359; that shout can't get inside Docker's private network, so this
  # sits on the server's real network, hears it, and passes it to Jellyfin, then carries the answer back.
  jellyfin-discovery:
    image: alpine/socat:latest
    container_name: jellyfin-discovery
    command: UDP4-RECVFROM:7359,broadcast,fork UDP4-SENDTO:172.30.0.10:7359
    network_mode: host
    depends_on:
      - jellyfin
    restart: unless-stopped

  # Lets people ask for a movie or show. Approved requests go straight to Sonarr/Radarr.
  # At home: http://<server-ip>:5055. Away: https://requests.jevans.cloud, through Caddy (README.md step 8).
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    # Seerr runs as user 1000 inside the container; its config folder must belong to 1000. See README.md step 5.
    init: true
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    ports:
      - 5055:5055
    volumes:
      - ${CONFIG_DIR}/seerr:/app/config
    networks:
      media:
        ipv4_address: 172.30.0.14
    restart: unless-stopped

  # Watch statistics for Jellyfin: what's playing now, who watched what, when, and for how long.
  # Home only, no Caddy site. Open it at http://<server-ip>:3002. See README.md step 11.
  jellydash:
    image: ghcr.io/themartz90/jellydash:latest
    container_name: jellydash
    environment:
      APP_TIMEZONE: ${TZ}
      # Keeps its notebook in one small file (SQLite), so it needs no database container.
      DB_DRIVER: sqlite3
      DB_NAME: /var/www/html/var/data/jellydash.sqlite
      # Talks to Jellyfin inside the server. The link address is what your browser opens.
      JELLYFIN_URL: http://jellyfin:8096
      JELLYFIN_LINK_URL: http://${SERVER_IP}:8096
      JELLYFIN_API_TOKEN: ${JELLYDASH_JELLYFIN_API_KEY}
      # Optional: a Requests page and alerts for new Seerr requests.
      JELLYSEER_URL: ${JELLYDASH_SEERR_API_KEY:+http://seerr:5055}
      JELLYSEER_API_TOKEN: ${JELLYDASH_SEERR_API_KEY:-}
      # Optional: "Jack started watching ..." on your phone through ntfy.sh.
      NTFY_URL: ${JELLYDASH_NTFY_TOPIC:+https://ntfy.sh}
      NTFY_TOPIC: ${JELLYDASH_NTFY_TOPIC:-}
      # Its own login, made the first time it starts.
      AUTH_ENABLED: "true"
      AUTH_ADMIN_USER: ${JELLYDASH_ADMIN_USER}
      AUTH_ADMIN_PASSWORD: ${JELLYDASH_ADMIN_PASSWORD}
    ports:
      # 80 inside, 3002 outside: the same address Jellystat had.
      - 3002:80
    volumes:
      - ${CONFIG_DIR}/jellydash/data:/var/www/html/var/data
      - ${CONFIG_DIR}/jellydash/sessions:/var/www/html/var/sessions
      - ${CONFIG_DIR}/jellydash/uploads:/var/www/html/public/uploads
    networks:
      # So it can reach Jellyfin at http://jellyfin:8096 and Seerr at http://seerr:5055.
      media:
        ipv4_address: 172.30.0.16
    restart: unless-stopped

  # ---- The front door: lets people outside your home reach Jellyfin and Seerr, and nothing else. ----
  # Serves https://media.jevans.cloud and https://requests.jevans.cloud with free, self-renewing certificates. See README.md steps 7 and 8.
  caddy:
    image: caddy:2
    container_name: caddy
    environment:
      # The scrambled shared password for https://watch.jevans.cloud (README.md step 25).
      SYNCTUBE_PASSWORD_HASH: ${SYNCTUBE_PASSWORD_HASH}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Keep it, or Caddy has to ask for new ones on every rebuild.
      - ${CONFIG_DIR}/caddy/data:/data
      - ${CONFIG_DIR}/caddy/config:/config
    networks:
      media:
        # Fixed so Jellyfin can be told this address is its trusted proxy.
        ipv4_address: 172.30.0.20
    restart: unless-stopped

  # ---- The ad blocker: answers "where is this website?" for every device at home. ----
  # Ads and trackers get "nowhere", everything else gets the real answer. See README.md step 10.
  # Setup page (first time only): http://<server-ip>:3001. Then the router hands out the server as DNS.
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    environment:
      # Without this it runs on UTC, so the query log and stats show the wrong hours.
      TZ: ${TZ}
    ports:
      # DNS, bound to the server's home address only. Ubuntu's own resolver keeps 127.0.0.53:53, so they don't clash.
      - ${SERVER_IP}:53:53/tcp
      - ${SERVER_IP}:53:53/udp
      # Its web page. 3000 inside, 3001 outside, because the dashboard already has 3000.
      - 3001:3000/tcp
    volumes:
      - ${CONFIG_DIR}/adguard/work:/opt/adguardhome/work
      - ${CONFIG_DIR}/adguard/conf:/opt/adguardhome/conf
    networks:
      media:
        ipv4_address: 172.30.0.15
    restart: unless-stopped

  # ---- The speed check: Speedtest Tracker tests your home internet on a timer and keeps the results. ----
  # Like a bathroom scale that weighs you every hour and writes it down, so you can see the trend.
  # Outside the VPN on purpose: it should measure your real Fios line, not the tunnel.
  # Replaced MySpeed, whose last image ran on Node.js 18, which no longer gets security fixes.
  # Home only, no Caddy site: http://<server-ip>:5216 (MySpeed's old port). See README.md step 18.
  speedtest-tracker:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      DISPLAY_TIMEZONE: ${TZ}
      # The key it scrambles its saved settings with. README.md step 18a makes it.
      APP_KEY: ${SPEEDTEST_APP_KEY}
      APP_URL: http://${SERVER_IP}:5216
      # Keeps its notebook in one small file (SQLite), so it needs no database container.
      DB_CONNECTION: sqlite
      # Every hour, at quarter past. Each test uses your full speed for about 20 seconds.
      SPEEDTEST_SCHEDULE: "15 * * * *"
      # Forget results older than a year, so the notebook stays small.
      PRUNE_RESULTS_OLDER_THAN: 365
    ports:
      - 5216:80
    volumes:
      # Every test result and its settings live here.
      - ${CONFIG_DIR}/speedtest-tracker:/config
    networks:
      media:
        # So the dashboard can show the latest result on its tile.
        ipv4_address: 172.30.0.18
    restart: unless-stopped

  # ---- The password safe: Vaultwarden, a home-made Bitwarden server. ----
  # The official Bitwarden apps and browser extensions talk to it as if it were Bitwarden's own cloud.
  # No port on your network: the apps insist on HTTPS, so the only way in is
  # https://vault.jevans.cloud through Caddy, and Caddy only lets in devices at home. See README.md step 17.
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    # Locked down: runs as you instead of the all-powerful root user, can't gain extra powers,
    # and can't change any of its own files. The only place it can write is its vault folder.
    user: ${PUID}:${PGID}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TZ: ${TZ}
      DOMAIN: https://vault.jevans.cloud
      # Listen on 8080 inside the box: ports below 1024 need root, and it no longer runs as root.
      ROCKET_PORT: 8080
      # Off once your account exists. README.md step 17 turns it on for one minute to make it.
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED}
      # The settings page at https://vault.jevans.cloud/admin. Its password is stored scrambled (a hash), never in plain text.
      # Leave it blank and the page is switched off entirely (README.md step 17e).
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      # Hide "Forgot password? Get a hint", which would otherwise show your hint to anyone who types your email.
      SHOW_PASSWORD_HINT: "false"
      # Don't fetch each saved website's little logo. Fetching them would tell your ISP
      # (and every one of those sites) which accounts you keep. Items show a plain globe instead.
      DISABLE_ICON_DOWNLOAD: "true"
    volumes:
      # Your whole vault lives here (scrambled with your master password). Back this folder up.
      - ${CONFIG_DIR}/vaultwarden:/data
    networks:
      media:
        # So Caddy can reach it.
        ipv4_address: 172.30.0.17
    restart: unless-stopped

  # ---- The dashboard: one page showing every container, with links. ----
  # Open it at https://home.jevans.cloud (home only, through Caddy) or http://<server-ip>:3000.
  # Its layout lives in the homepage/ folder next to this file.
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    depends_on:
      - dockerproxy
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      HOMEPAGE_ALLOWED_HOSTS: ${SERVER_IP}:3000,home.jevans.cloud
      HOMEPAGE_VAR_SERVER_IP: ${SERVER_IP}
      HOMEPAGE_VAR_TZ: ${TZ}
      # Lets the Speedtest Tracker tile read the latest result (README.md step 18c).
      HOMEPAGE_VAR_SPEEDTEST_TOKEN: ${SPEEDTEST_API_TOKEN}
    ports:
      - 3000:3000
    volumes:
      - ./homepage:/app/config
      # Only so the dashboard can show how full the drive is.
      - ${DATA_DIR}:/data:ro
    networks:
      dashboard:
      # So Caddy can reach it for home.jevans.cloud.
      media:
        ipv4_address: 172.30.0.30
    restart: unless-stopped

  # A doorman for Docker. Homepage may ask "what's running?", nothing else:
  # starting, stopping or creating containers is refused. Not reachable from your network.
  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: dockerproxy
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dashboard
    restart: unless-stopped

  # ---- Server health: charts of CPU, memory, drives, temperatures and each app's use, plus alerts. ----
  # Like a fitness tracker on your wrist: the agent is the sensor strapped to the server, reading the
  # PC and every container; the hub is the phone app that keeps the history, draws the charts, and
  # buzzes your phone (through ntfy) when a number goes over a line you set. See README.md step 16.
  # Home only, no Caddy site: http://<server-ip>:3003.
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    environment:
      TZ: ${TZ}
      # The address you open it at, used for links in its alerts.
      APP_URL: http://${SERVER_IP}:3003
      # Lets the read-only "reports" login see the server too (README.md step 23). Only you use Beszel, so nothing else changes.
      SHARE_ALL_SYSTEMS: "true"
    ports:
      # 8090 inside, 3003 outside: the address Grafana had.
      - 3003:8090
    volumes:
      # Your login, settings, alerts and history live here.
      - ${CONFIG_DIR}/beszel/data:/beszel_data
      # A private pipe (a "socket" file) the agent and hub talk through, so the agent needs no open port.
      - ${CONFIG_DIR}/beszel/socket:/beszel_socket
    networks:
      - monitoring
    restart: unless-stopped

  # The sensor. Uses the server's own network so it sees the real network card's traffic.
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    network_mode: host
    environment:
      # Talk to the hub through the socket file instead of opening a port.
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:3003
      # The hub's ID card and the agent's pass, both copied from the hub's "Add System" box (README.md step 16c).
      KEY: ${BESZEL_AGENT_KEY}
      TOKEN: ${BESZEL_AGENT_TOKEN}
    volumes:
      - ${CONFIG_DIR}/beszel-agent:/var/lib/beszel-agent
      - ${CONFIG_DIR}/beszel/socket:/beszel_socket
      # To read how much CPU, memory and network each container uses.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The media drive, read-only, so it gets its own chart and counts for the "disk full" alert.
      # "sdb1" is the drive's name in `lsblk` (for read/write speed), "Media" is the label you see.
      - ${DATA_DIR}:/extra-filesystems/sdb1__Media:ro
    restart: unless-stopped

  # ---- The alarm: Uptime Kuma checks every app and the server's health once a minute ----
  # and sends a push notification to your phone (through the ntfy app) when something breaks, and again when it's fixed.
  # Like a night watchman doing rounds with a list: "Jellyfin's door open? VPN on? Drive plugged in?"
  # (Beszel watches the numbers: disk space, temperature, memory.)
  # Home only, no Caddy site: http://<server-ip>:3004. Away from home, Tailscale on your phone gets you in. See README.md step 22.
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    environment:
      TZ: ${TZ}
    ports:
      # 3001 inside, 3004 outside: AdGuard has 3001 and Beszel has 3003.
      - 3004:3001
    volumes:
      # Your monitors, alert settings and history live here.
      - ${CONFIG_DIR}/uptime-kuma:/app/data
    networks:
      # To knock on each app's door by name (jellyfin, sonarr...).
      media:
        ipv4_address: 172.30.0.21
      # To ask the Docker doorman (dockerproxy) whether each container is running and healthy. Read-only.
      dashboard:
    restart: unless-stopped

  # ---- Watch parties: SyncTube plays the same YouTube video (or any video link) for everyone at once, with a chat. ----
  # Like a cinema projectionist: whoever holds the "Leader" button presses play or pause, and every screen follows.
  # There's no ready-made image, so Docker builds it from the author's code, pinned to one exact version,
  # using our recipe in synctube/Dockerfile so it runs on a patched Node.js we pick.
  # To update SyncTube: change the long code after "#" to a newer commit, then `docker compose up -d --build synctube`.
  # At home: http://<server-ip>:4200. From anywhere: https://watch.jevans.cloud through Caddy,
  # behind a shared password. See README.md steps 24 and 25.
  synctube:
    build:
      context: ./synctube
      additional_contexts:
        synctube-src: https://github.com/RblSb/SyncTube.git#7b0ea5877eefcfe70744683a4273b52b3e34037a
    container_name: synctube
    environment:
      TZ: ${TZ}
    ports:
      - 4200:4200
    volumes:
      # Settings (config.json), admin logins, the chat history and uploaded videos live here.
      - ${CONFIG_DIR}/synctube:/app/user
    # SyncTube takes admin commands typed into its console: `docker attach synctube` reaches it (step 24c).
    stdin_open: true
    tty: true
    networks:
      media:
        ipv4_address: 172.30.0.22
    restart: unless-stopped

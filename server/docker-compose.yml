# Media server stack: Jellyfin + the arr suite, with downloads locked inside a VPN.
# Fill in .env first (copy .env.example), then run: docker compose up -d
# See README.md in this folder for the full walkthrough.

name: media

networks:
  media:
    ipam:
      config:
        # Fixed range so the VPN firewall can allow traffic between containers,
        # and so Prowlarr (inside the VPN) can find Sonarr/Radarr by address.
        - subnet: 172.30.0.0/24
  # The dashboard and its Docker helper talk on their own network, away from the media apps.
  dashboard:

x-common-env: &common-env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}

services:
  # ---- The VPN tunnel. qBittorrent and Prowlarr live inside it. ----
  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ}
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER}
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES}
      # Let the containers inside the tunnel talk to the rest of the stack and your home network.
      FIREWALL_OUTBOUND_SUBNETS: 172.30.0.0/24,${LAN_SUBNET}
    ports:
      # The web pages of the apps inside the tunnel are published here, on gluetun.
      - 8080:8080 # qBittorrent
      - 9696:9696 # Prowlarr
    volumes:
      - ${CONFIG_DIR}/gluetun:/gluetun
    networks:
      media:
        ipv4_address: 172.30.0.2
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    # Share gluetun's network. No VPN means no internet for this container: that is the kill switch.
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      <<: *common-env
      WEBUI_PORT: 8080
    volumes:
      - ${CONFIG_DIR}/qbittorrent:/config
      - ${DATA_DIR}:/data
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      <<: *common-env
    volumes:
      - ${CONFIG_DIR}/prowlarr:/config
    restart: unless-stopped

  # Opens Cloudflare-protected search sites for Prowlarr in a hidden browser.
  # Inside the tunnel too, so those sites see the VPN, not your home. Prowlarr reaches it at http://localhost:8191.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    restart: unless-stopped

  # ---- Everything below uses your normal connection. ----
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      <<: *common-env
    ports:
      - 8989:8989
    volumes:
      - ${CONFIG_DIR}/sonarr:/config
      - ${DATA_DIR}:/data
    networks:
      media:
        ipv4_address: 172.30.0.11
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      <<: *common-env
    ports:
      - 7878:7878
    volumes:
      - ${CONFIG_DIR}/radarr:/config
      - ${DATA_DIR}:/data
    networks:
      media:
        ipv4_address: 172.30.0.12
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      <<: *common-env
    ports:
      - 6767:6767
    volumes:
      - ${CONFIG_DIR}/bazarr:/config
      - ${DATA_DIR}/media:/data/media
    networks:
      media:
        ipv4_address: 172.30.0.13
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      <<: *common-env
      JELLYFIN_PublishedServerUrl: ${JELLYFIN_URL}
    ports:
      - 8096:8096
    volumes:
      - ${CONFIG_DIR}/jellyfin:/config
      # Jellyfin only needs to read your library, never change it.
      - ${DATA_DIR}/media:/data/media:ro
    # The CPU's built-in graphics chip (Intel Quick Sync), for fast video conversion.
    # Turn it on in Jellyfin: Dashboard → Playback → Transcoding. Remove these two lines on a server without /dev/dri.
    devices:
      - /dev/dri:/dev/dri
    networks:
      media:
        ipv4_address: 172.30.0.10
    restart: unless-stopped

  # Lets people ask for a movie or show. Approved requests go straight to Sonarr/Radarr.
  # At home: http://<server-ip>:5055. Away: https://requests.jevans.cloud, through Caddy (README.md step 8).
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    # Seerr runs as user 1000 inside the container; its config folder must belong to 1000. See README.md step 5.
    init: true
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    ports:
      - 5055:5055
    volumes:
      - ${CONFIG_DIR}/seerr:/app/config
    networks:
      media:
        ipv4_address: 172.30.0.14
    restart: unless-stopped

  # ---- The front door: lets people outside your home reach Jellyfin and Seerr, and nothing else. ----
  # Serves https://media.jevans.cloud and https://requests.jevans.cloud with free, self-renewing certificates. See README.md steps 7 and 8.
  caddy:
    image: caddy:2
    container_name: caddy
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Keep it, or Caddy has to ask for new ones on every rebuild.
      - ${CONFIG_DIR}/caddy/data:/data
      - ${CONFIG_DIR}/caddy/config:/config
    networks:
      media:
        # Fixed so Jellyfin can be told this address is its trusted proxy.
        ipv4_address: 172.30.0.20
    restart: unless-stopped

  # ---- The ad blocker: answers "where is this website?" for every device at home. ----
  # Ads and trackers get "nowhere", everything else gets the real answer. See README.md step 10.
  # Setup page (first time only): http://<server-ip>:3001. Then the router hands out the server as DNS.
  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    ports:
      # DNS, bound to the server's home address only. Ubuntu's own resolver keeps 127.0.0.53:53, so they don't clash.
      - ${SERVER_IP}:53:53/tcp
      - ${SERVER_IP}:53:53/udp
      # Its web page. 3000 inside, 3001 outside, because the dashboard already has 3000.
      - 3001:3000/tcp
    volumes:
      - ${CONFIG_DIR}/adguard/work:/opt/adguardhome/work
      - ${CONFIG_DIR}/adguard/conf:/opt/adguardhome/conf
    networks:
      media:
        ipv4_address: 172.30.0.15
    restart: unless-stopped

  # ---- The dashboard: one page showing every container, with links. ----
  # Open it at https://home.jevans.cloud (home only, through Caddy) or http://<server-ip>:3000.
  # Its layout lives in the homepage/ folder next to this file.
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    depends_on:
      - dockerproxy
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      HOMEPAGE_ALLOWED_HOSTS: ${SERVER_IP}:3000,home.jevans.cloud
      HOMEPAGE_VAR_SERVER_IP: ${SERVER_IP}
      HOMEPAGE_VAR_TZ: ${TZ}
    ports:
      - 3000:3000
    volumes:
      - ./homepage:/app/config
      # Only so the dashboard can show how full the drive is.
      - ${DATA_DIR}:/data:ro
    networks:
      dashboard:
      # So Caddy can reach it for home.jevans.cloud.
      media:
        ipv4_address: 172.30.0.30
    restart: unless-stopped

  # A doorman for Docker. Homepage may ask "what's running?", nothing else:
  # starting, stopping or creating containers is refused. Not reachable from your network.
  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: dockerproxy
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dashboard
    restart: unless-stopped
